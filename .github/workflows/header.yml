name: Update profile header

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build_header.py
      - build_tracker.py
      - build_game.py
      - ascii_dark.txt
      - ascii_light.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh stats and rebuild SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python build_header.py --fetch

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg tracker_dark.svg tracker_light.svg game_dark.svg game_light.svg stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile header stats"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
